<!DOCTYPE html>
<html>
<head>
    <title>Payment Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .payment-box {
            background: white;
            width: 400px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px gray;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row div {
            width: 50%;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }
    </style>
</head>

<body>

    <div class="payment-box">

        <h2>💳 Payment</h2>

        <label>Card Holder Name</label>
        <input type="text" placeholder="Enter your name">

        <label>Card Number</label>
        <input type="text" placeholder="1234 5678 9012 3456">

        <div class="row">

            <div>
                <label>Expiry Date</label>
                <input type="text" placeholder="MM/YY">
            </div>

            <div>
                <label>CVV</label>
                <input type="password" placeholder="CVV">
            </div>

        </div>

        <label>Amount</label>
        <input type="text" placeholder="₹ Enter Amount">

        <button type="submit">Pay Now</button>

    </div>

</body>
</html>
