<!DOCTYPE html>
<html>
<head>
    <title>My Webpage</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        header {
            background-color: #333;
            color: white;
            padding: 25px;
        }

        nav {
            background-color: #555;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
        }

        .content {
            padding: 50px;
        }

        .box {
            background-color: white;
            width: 60%;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        button {
            background-color: #333;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        footer {
            background-color: #333;
            color: white;
            padding: 15px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>
        <p>Welcome to my webpage</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <div class="content">

        <div class="box">
            <h2>Welcome 👋</h2>

            <p>
                This is my first webpage created using HTML and CSS.
            </p>

            <button>Click Me</button>
        </div>

    </div>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
